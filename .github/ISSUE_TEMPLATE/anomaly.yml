name: Known Anomaly Report
description: Report an anomaly for tracking in the compliance registry (docs/validation/known_anomalies.yaml)
labels: ["known-anomaly"]
body:
  - type: markdown
    attributes:
      value: >
        Severity definitions are in DOCUMENTATION_ARCHITECTURE.md section 8.2. A silent wrong result is never
        minor; a library value that differs from its cited source, and a reference implementation that
        differs from its family definition, are silent wrong results. A licensing objection is not an
        anomaly: see the takedown procedure in CONTRIBUTING.md.
  - type: input
    id: title
    attributes:
      label: Anomaly title
      description: "Short, specific, searchable: name the component and the failure"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - major
        - minor
        - enhancement
    validations:
      required: true
  - type: dropdown
    id: safety_relevance
    attributes:
      label: Safety relevance
      options:
        - safety_relevant
        - not_safety_relevant
        - context_dependent
    validations:
      required: true
  - type: textarea
    id: safety_rationale
    attributes:
      label: Safety relevance rationale
      description: >
        Why this severity and safety relevance were chosen. Must be understandable by someone unfamiliar
        with the codebase.
    validations:
      required: true
  - type: input
    id: affected_components
    attributes:
      label: Affected components
      description: >
        Comma-separated, e.g. schema:VesaliusAcousticAPI, reader:resolve, method:VES-MTH-002,
        model:vesalius.mechanical.ogden_incompressible.v1, data:VES-MAT-0003
    validations:
      required: true
  - type: input
    id: affected_versions
    attributes:
      label: Affected versions
      description: "PEP 440 specifier set, e.g. >=0.1.0 (still affected) or >=0.1.0, <0.2.0 (fixed in 0.2.0)"
    validations:
      required: true
  - type: textarea
    id: source_check
    attributes:
      label: For data and family anomalies, the check
      description: >
        Data: the material and field, the stored value, the cited source and locator, and what the source
        actually gives (with units). Family: the family identifier, the input, what the reference
        implementation returns, and what the definition requires.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if any)

# Deploys site/, as it is, to GitHub Pages at https://openmaterica.org. There is no build step. The custom domain
# is set in the repository's Pages settings: a site deployed by a workflow needs no CNAME file, and GitHub ignores
# one ("Managing a custom domain for your GitHub Pages site", GitHub Docs).
#
# ci.yml needs no change for this workflow. Its gate counts as code only src/, tests/, scripts/,
# docs/specification/, pyproject.toml, uv.lock and ci.yml, so a change to site/ or to this file runs the gate
# alone, as any other docs-only change does.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time. A deployment in progress is never cancelled; a newer run waits, and replaces any run
# still queued.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: deploy site
    runs-on: ubuntu-latest
    # deploy-pages stops waiting for the deployment after 10 minutes on its own.
    timeout-minutes: 15
    permissions:
      contents: read # to check out site/
      pages: write # to create the deployment
      id-token: write # for the OIDC token deploy-pages presents
    # Its deployment branch rule should allow main only, so that a manual run from another branch cannot publish.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

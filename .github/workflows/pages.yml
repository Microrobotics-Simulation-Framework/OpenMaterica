# Deploys site/, as it is, to GitHub Pages at https://openmaterica.org, with everything under src/materica/schema/
# at /schema/. The only build step writes an index page into /schema/ and each directory under it
# (scripts/schema_index.py, standard library only), since Pages lists no directory itself. The custom domain is
# set in the repository's Pages settings: a site deployed by a workflow needs no CNAME file, and GitHub ignores
# one ("Managing a custom domain for your GitHub Pages site", GitHub Docs).
#
# ci.yml's gate counts site/ and this file as code, as it does every path but those it lists as documentation,
# so a pull request that changes either runs every job the gate gives to code.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/images/**"
      - "src/materica/schema/**"
      - "scripts/schema_index.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time. A deployment in progress is never cancelled; a newer run waits, and replaces any run
# still queued.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

# Under bash with `-eo pipefail`, and on ubuntu-24.04, as ci.yml says above its jobs.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy site
    runs-on: ubuntu-24.04
    # deploy-pages stops waiting for the deployment after 10 minutes on its own.
    timeout-minutes: 15
    permissions:
      contents: read # to check out site/ and the schemas
      pages: write # to create the deployment
      id-token: write # for the OIDC token deploy-pages presents
    # Its deployment branch rule should allow main only, so that a manual run from another branch cannot publish.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Each deploy replaces the whole site, so every released schema version must stay in the artifact: the whole
      # directory is copied, never only the newest version. Released schemas never change (CI fails where one
      # does: tests/spec_sync/test_released_schemas.py), and their permanent identifiers,
      # https://w3id.org/materica/schema/<version>/..., redirect to these copies. The directory is absent until
      # the first schema lands; mkdir fails if site/ ever holds a schema/ of its own.
      # The logo and the favicons live in assets/images/, beside the rest of the project's artwork, and are
      # served from the site's root.
      - name: Stage site/, with the logo and favicons at its root and the schemas at /schema/
        run: |
          cp -R site "$RUNNER_TEMP/site"
          cp assets/images/logo.png assets/images/favicon/* "$RUNNER_TEMP/site/"
          if [ -d src/materica/schema ]; then
            mkdir "$RUNNER_TEMP/site/schema"
            cp -R src/materica/schema/. "$RUNNER_TEMP/site/schema/"
            python3 scripts/schema_index.py "$RUNNER_TEMP/site/schema"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

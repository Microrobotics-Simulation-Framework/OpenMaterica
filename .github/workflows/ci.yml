# Why CI is shaped this way. The repository is private, on GitHub Team: 3,000 Actions minutes a month, each
# Linux job billed rounded up to a whole minute. So there are few jobs, and a first job (gate) finds what a
# change touched; the other jobs skip at job level, because a skipped job counts as passed for a required check
# while a workflow skipped by `paths` would leave the check pending. A docs-only change runs the gate alone,
# which also checks sign-offs. Pull requests test the oldest and newest Python; main, the weekly run and a
# manual run test every supported one. Hypothesis is never cut to save minutes: the `ci` profile runs whenever
# the core, the property tests or their configuration change and on every code change to main, and the `deep`
# profile weekly and on manual runs. Atheris fuzzes weekly and on manual runs only, for a fixed time a target.
# When the repository goes public (Actions minutes are then free): set the pull-request Python list in `tests`
# to all five, and the path filter may go.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds of fuzzing for each of the two Atheris targets
        type: number
        default: 300
      fuzz_only:
        description: Run the fuzz job alone
        type: boolean
        default: false

# One group per ref and event, so that a push to main never cancels the weekly run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  gate:
    name: sign-off and changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      hypothesis: ${{ steps.paths.outputs.hypothesis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit signed off (CONTRIBUTING constraint 1)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_signoff.py "$BASE" "$HEAD"

      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          code='^(src/|tests/|scripts/|docs/specification/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'
          hypothesis='^(src/materica/core/|tests/property/|tests/conftest\.py$|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'
          case "$EVENT" in
            pull_request) changed=$(git diff --name-only "$PR_BASE...$PR_HEAD") ;;
            push) changed=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER" 2>/dev/null) || changed=everything ;;
            *) changed=everything ;;
          esac
          if [ "$changed" = everything ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "hypothesis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          grep -qE "$code" <<< "$changed" && touched_code=true || touched_code=false
          grep -qE "$hypothesis" <<< "$changed" && touched_core=true || touched_core=false
          echo "code=$touched_code" >> "$GITHUB_OUTPUT"
          # On main, every code change runs the Hypothesis job.
          if [ "$EVENT" = push ]; then touched_core=$touched_code; fi
          echo "hypothesis=$touched_core" >> "$GITHUB_OUTPUT"

  static:
    name: lint, types, wheel
    needs: gate
    if: needs.gate.outputs.code == 'true' && !inputs.fuzz_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Cache pyright's Node package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pyright-python
          key: pyright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pyright

      - run: uv build
      - name: The wheel holds py.typed, the conformance data byte for byte, and its PEP 639 licence
        run: uv run python scripts/check_wheel.py dist/*.whl
      - name: A consumer's code type-checks against the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/consumer"
          uv pip install --python "$RUNNER_TEMP/consumer/bin/python" dist/*.whl
          mkdir "$RUNNER_TEMP/snippet"
          cp tests/typing/consumer_snippet.py "$RUNNER_TEMP/snippet/"
          cd "$RUNNER_TEMP/snippet"
          uv run --project "$GITHUB_WORKSPACE" mypy --strict --python-executable "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py
          uv run --project "$GITHUB_WORKSPACE" pyright --pythonpath "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py
      - name: Control, the same check fails once py.typed is gone
        run: |
          rm "$("$RUNNER_TEMP/consumer/bin/python" -c 'import materica, pathlib; print(pathlib.Path(materica.__file__).parent / "py.typed")')"
          cd "$RUNNER_TEMP/snippet"
          if uv run --project "$GITHUB_WORKSPACE" mypy --strict --python-executable "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py; then
            echo "::error::the snippet type-checked without py.typed, so the check above cannot fail"
            exit 1
          fi

  tests:
    name: tests (Python ${{ matrix.python }})
    needs: gate
    if: needs.gate.outputs.code == 'true' && !inputs.fuzz_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: the oldest and newest Python. Main, the weekly run and a manual run: all five.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.15"]' || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # Every test, the property tests at the `dev` profile: Python's json differs between versions, so the
      # properties run on each; their depth is the Hypothesis job's.
      - run: uv run pytest
        env:
          MATERICA_HYPOTHESIS_PROFILE: dev

  hypothesis:
    name: hypothesis (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'deep' || 'ci' }})
    needs: gate
    if: needs.gate.outputs.hypothesis == 'true' && !inputs.fuzz_only
    runs-on: ubuntu-latest
    # `deep` took 14.5 minutes and `ci` under a minute, on two workers locally (2026-10-14): about three times that.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 45 || 10 }}
    env:
      MATERICA_HYPOTHESIS_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'deep' || 'ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Python, because it runs this suite fastest: the `ci` profile took 47 to 49 s on 3.15 and 63
      # to 66 s on 3.11, two workers each (measured 2026-10-14). Every Python runs the properties at `dev`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The example database, so that an example that failed once is replayed first. Cache entries are
      # immutable, so each run saves under its own key and restores the latest; it saves even when the run
      # fails, since a failing example is what most needs keeping.
      - name: Restore the example database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-
      # A worker per vCPU: minutes are billed by wall time. Work stealing keeps the long properties from finishing
      # last on one worker.
      - name: Property tests and mutants, with the draw-rejection and feature audits (tests/property/conftest.py)
        run: uv run pytest tests/property -n auto --dist worksteal --hypothesis-show-statistics
      - name: Save the example database
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ github.run_id }}

  result:
    name: CI result
    # The one check the ruleset on main requires. A matrix job skipped by its `if` reports under another name, so
    # requiring the jobs by name would leave docs-only pull requests waiting; a skipped job passes this one.
    needs: [gate, static, tests, hypothesis]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  fuzz:
    name: fuzz (Atheris)
    # After the Hypothesis job, so that it starts from the example database that job just saved, and saves the
    # two jobs' finds together; it runs whether that job passed, failed or was skipped.
    needs: hypothesis
    # Weekly and on a manual run only: every second of fuzzing is a second billed.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Two targets at the default 300 s, the control (at most 3 minutes a target) and the replay: about 15
    # minutes. A manual run longer than about 900 s a target needs this raised.
    timeout-minutes: 45
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || 300 }}
      # The fuzzing and its replay run under one profile: the properties' sizes come from it, and a failure
      # replays only under the profile it was found with.
      MATERICA_HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Atheris 3.1.0 publishes wheels for Python 3.12 to 3.14 only.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group fuzz

      # Before the example database is restored, and with it removed after: both targets must find a fault
      # seeded in `parse` (tests/fuzz/seeded_fault.py), and the replay must find it again and shrink it.
      - name: Control, a fault seeded in parse is found, replayed and shrunk
        env:
          MATERICA_FUZZ_SEEDED_FAULT: "1"
        run: |
          control="$RUNNER_TEMP/control"
          mkdir -p "$control/findings"
          uv run python -m tests.fuzz.jsonio_bytes --seed "$control/corpus"
          uv run python -m tests.fuzz.jsonio_bytes "$control/corpus" -dict=tests/fuzz/json.dict -max_len=4096 \
            -max_total_time=180 -artifact_prefix="$control/findings/" > "$control/bytes.log" 2>&1 || true
          uv run python -m tests.fuzz.properties -max_total_time=180 -artifact_prefix="$control/findings/" \
            > "$control/properties.log" 2>&1 || true
          uv run python -m pytest -p tests.fuzz.seeded_fault -q --hypothesis-show-statistics \
            tests/property/test_jsonio_properties.py tests/property/test_canonical_properties.py \
            tests/property/test_hashing_properties.py > "$control/replay.log" 2>&1 || true
          for log in bytes properties replay; do
            if ! grep -q "IndexError: the seeded fault" "$control/$log.log"; then
              tail -40 "$control/$log.log"
              echo "::error::the $log step did not find the seeded fault, so it could not find a real one"
              exit 1
            fi
          done
          # Only a stored example can fail in the reuse phase: the replay found what the fuzzing saved.
          if ! grep -A3 "during reuse phase" "$control/replay.log" | grep -qE " [1-9][0-9]* failing"; then
            echo "::error::the replay did not find the failure the fuzzing saved"
            exit 1
          fi
          grep -B2 -A3 -E "document=|data=" "$control/replay.log" | head -40
          rm -rf .hypothesis

      # The database the Hypothesis job saved in this run; the latest saved, where that job did not run.
      - name: Restore the example database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-
      # Target 1's corpus from earlier runs, so that its coverage builds up; it is seeded afresh as well.
      - name: Restore the raw-bytes corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-kept
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-
      - name: Fuzz raw bytes into parse (tests/fuzz/jsonio_bytes.py)
        run: |
          mkdir -p "$RUNNER_TEMP/findings" "$RUNNER_TEMP/corpus-kept"
          uv run python -m tests.fuzz.jsonio_bytes --seed "$RUNNER_TEMP/corpus"
          find "$RUNNER_TEMP/corpus-kept" -type f -exec cp -t "$RUNNER_TEMP/corpus" {} +
          uv run python -m tests.fuzz.jsonio_bytes "$RUNNER_TEMP/corpus" -dict=tests/fuzz/json.dict -max_len=4096 \
            -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      # libFuzzer keeps, in a fresh directory, only the inputs that add coverage, so the cache stays small. A
      # merge that went wrong keeps nothing, and must not replace the corpus.
      - name: Minimise the raw-bytes corpus
        id: merge
        if: success() || failure()
        run: |
          mkdir "$RUNNER_TEMP/corpus-next"
          uv run python -m tests.fuzz.jsonio_bytes -merge=1 "$RUNNER_TEMP/corpus-next" "$RUNNER_TEMP/corpus"
          if [ -z "$(ls -A "$RUNNER_TEMP/corpus-next")" ]; then
            echo "::error::the merge kept no input"
            exit 1
          fi
          echo "kept $(ls "$RUNNER_TEMP/corpus-next" | wc -l) of $(ls "$RUNNER_TEMP/corpus" | wc -l) inputs"
          rm -rf "$RUNNER_TEMP/corpus-kept"
          mv "$RUNNER_TEMP/corpus-next" "$RUNNER_TEMP/corpus-kept"
      # Saved from the path it is restored to: a cache entry is versioned by its path.
      - name: Save the raw-bytes corpus
        if: steps.merge.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-kept
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
      - name: Fuzz the properties (tests/fuzz/properties.py)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          uv run python -m tests.fuzz.properties -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      # What the property target found is in the example database: replayed first here, and shrunk.
      - name: Replay and shrink what was found
        if: success() || failure()
        run: uv run pytest tests/property -n auto --dist worksteal
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
      # Both jobs' finds, under the shared prefix: the next run of either job restores them.
      - name: Save the example database
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ github.run_id }}-fuzz

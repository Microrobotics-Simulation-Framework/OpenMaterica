# Why CI is shaped this way. The repository is public, so GitHub's standard runners cost nothing; what matters is
# how fast a change gets its answer. So a first job (gate) finds what a change touched, and the other jobs skip
# at job level when nothing relevant changed: a skipped job counts as passed for a required check, while a
# workflow skipped by `paths` would leave the check pending. A docs-only pull request runs the gate alone, which
# also checks sign-offs and that nothing private is named. A merge to main runs every job, whatever it changed,
# and the `result` job fails where a job the gate asked for did not succeed.
# Every pull request tests all five Pythons, in parallel, so breadth costs no waiting. The
# per-push critical path is the Hypothesis job at the `ci` profile, which runs on every change but one confined
# to paths no part of it reads (the gate lists them). Keep it short: work that would lengthen the
# longest job runs beside it as a job of its own (the generated files) or a shard (the property tests), so that
# a push waits for the longest job only. The `deep` profile and Atheris fuzzing, slow by design, run weekly and
# on manual runs only.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds of fuzzing for each of the three Atheris targets
        type: number
        default: 300
      fuzz_only:
        description: Run the fuzz job alone
        type: boolean
        default: false

# A newer push to a pull request cancels the run of the older one, which nobody will read. Every other run has
# a group of its own, so that none is ever cancelled or replaced: each merge to main is tested whole, and the
# weekly run never meets a push. tests/unit/test_ci_workflows.py evaluates both settings for each event.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

# Every step of every workflow here runs under bash with `-eo pipefail` (GitHub's `shell: bash`), so that a
# command that fails inside a pipe fails its step; without it GitHub runs `bash -e`, where only a pipe's last
# command counts. tests/unit/test_ci_workflows.py holds each workflow to it, and runs the steps it tests so.
defaults:
  run:
    shell: bash

# Every job of every workflow here runs on ubuntu-24.04, never ubuntu-latest, which GitHub moves to Ubuntu
# 26.04 between 2026-10-19 and 2026-11-19 (its changelog of 2026-09-17): a label that moves changes the
# system Python and the tools under a run whose code did not change. A newer image is a deliberate change,
# made in every workflow at once and in tests/unit/test_ci_workflows.py, which holds each job to it.
jobs:
  gate:
    name: sign-off and changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      hypothesis: ${{ steps.paths.outputs.hypothesis }}
      commits: ${{ steps.paths.outputs.commits }}
      workflow_blob: ${{ steps.paths.outputs.workflow_blob }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit signed off (CONTRIBUTING constraint 1)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_signoff.py "$BASE" "$HEAD"

      # The tracked files, the messages of the commits this event brings (on a push, all of main's when the
      # commit before it is unknown), and a pull request's branch name, public from its push. Without the
      # secret, as on a fork, the private paths are still checked and the names are not, with a warning
      # (CONTRIBUTING, "Confidentiality").
      - name: No private name or path in the tracked files or the commit messages
        env:
          CONFIDENTIAL_SCAN_KEY: ${{ secrets.CONFIDENTIAL_SCAN_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ -z "$CONFIDENTIAL_SCAN_KEY" ]; then
            echo "::warning::CONFIDENTIAL_SCAN_KEY is not set, so the private names were not checked; the private paths were"
          fi
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              range="$PUSH_AFTER"
              if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then range="$PUSH_BEFORE..$PUSH_AFTER"; fi ;;
            *) range="" ;;
          esac
          python3 scripts/check_confidential.py ${range:+--messages "$range"} ${HEAD_REF:+--ref-name "$HEAD_REF"}

      # Its outputs decide which jobs run: `code` the static, generated-files, test and control jobs,
      # `hypothesis` the Hypothesis job, and `commits`, a JSON list, the commits the per-commit job checks.
      # tests/unit/test_ci_workflows.py runs this step and holds each job's `if` to them.
      # The gate fails closed: it lists the paths that are documentation only, which no test, script, generator,
      # build or workflow reads, and counts every other path as code, a new one included. Some documents are
      # code: README.md and LICENSE go into the wheel, typings/ to the type checkers, docs/specification/, the
      # architecture draft and the documentation plan to the spec-sync tests, and site/ to the Pages workflow.
      # tests/unit/test_ci_workflows.py checks that no test or script names a path listed here.
      # The Hypothesis job's gate fails closed in the same way (maintainer, 2026-10-17): beside the documentation,
      # it lists the paths that no part of that job reads, neither a module its property tests load or import,
      # nor a path such a module names, nor the job's steps, its build (pyproject.toml's readme and licence, the
      # lock file, src/) or this workflow, and every other path runs the job, a new one and any test included.
      # tests/unit/test_ci_workflows.py checks each of those against the paths listed here.
      - name: Changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          FUZZ_ONLY: ${{ inputs.fuzz_only }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_paths='CHANGELOG\.md|CLAUDE\.md|CONTRIBUTING\.md|SECURITY\.md|docs/regulatory/.+|docs/validation/.+|\.github/ISSUE_TEMPLATE/.+|\.github/pull_request_template\.md'
          hypothesis_free='site/.+|assets/.+|design/.+|DOCUMENTATION_ARCHITECTURE\.md|typings/.+|scripts/(check_confidential|check_signoff|check_wheel|freeze_schema|gen_shapes|schema_index)\.py|scripts/README\.md|scripts/confidential_digests\.txt|scripts/pre-push|\.github/workflows/(pages|release)\.yml|\.github/workflows/README\.md'
          commits=()
          workflow_blob=
          if [ "$FUZZ_ONLY" = true ]; then
            # A manual run of the fuzz job alone.
            code=false
            hypothesis=false
          elif [ "$EVENT" = pull_request ]; then
            # Both paths of a file moved, which git would otherwise give as a rename, by where it went alone:
            # a module moved into a documentation path is a change to code.
            changed=$(git diff --no-renames --name-only "$PR_BASE...$PR_HEAD")
            # A pull request names its own files: printed with workflow commands stopped, so that a name
            # beginning with `::` is printed, not obeyed.
            stop=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
            echo "::stop-commands::$stop"
            printf '%s\n' "$changed"
            echo "::$stop::"
            # Documentation only when there are paths and each is listed: a diff that names none is code.
            if [ -n "$changed" ] && ! grep -qvxE "$docs_paths" <<< "$changed"; then code=false; else code=true; fi
            if [ -n "$changed" ] && ! grep -qvxE "$docs_paths|$hypothesis_free" <<< "$changed"; then
              hypothesis=false
            else
              hypothesis=true
            fi
            # Each commit but the head, oldest first, for the per-commit job, but one that changes documentation
            # alone: its tree is its parent's but for paths no test reads, and its parent is listed too, or is
            # the base. A commit that changes no path is listed, as a diff that names none is code. A force-push
            # lists the commits the branch holds now. The list is taken apart from the loop, so that a failure
            # of git fails the step rather than list nothing.
            revisions=$(git rev-list --reverse "$PR_BASE..$PR_HEAD")
            for sha in $revisions; do
              [ "$sha" != "$PR_HEAD" ] || continue
              own=$(git diff --no-renames --name-only "$sha^" "$sha")
              if [ -z "$own" ] || grep -qvxE "$docs_paths" <<< "$own"; then commits+=("$sha"); fi
            done
            echo "${#commits[@]} commits before the head to check on their own"
            # A matrix holds at most 256 jobs, and a run that left some out would pass without them.
            if [ "${#commits[@]}" -gt 256 ]; then
              echo "::error::${#commits[@]} commits to check on their own, more than the 256 jobs of a matrix: split the pull request"
              exit 1
            fi
            # This workflow as it runs (the merge commit's), which the per-commit job's record of a passed tree
            # names, so that a pass under other checks is never taken for one under these.
            workflow_blob=$(git hash-object .github/workflows/ci.yml)
          else
            # A merge to main, the weekly run and a manual run test everything, whatever changed.
            code=true
            hypothesis=true
          fi
          {
            echo "code=$code"
            echo "hypothesis=$hypothesis"
            echo "commits=$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${commits[@]}")"
            echo "workflow_blob=$workflow_blob"
          } >> "$GITHUB_OUTPUT"

  static:
    name: lint, types, wheel
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Cache pyright's Node package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pyright-python
          key: pyright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pyright

      - run: uv build
      - name: The wheel holds py.typed, the conformance data byte for byte, and its PEP 639 licence
        run: uv run python scripts/check_wheel.py dist/*.whl
      - name: A consumer's code type-checks against the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/consumer"
          uv pip install --python "$RUNNER_TEMP/consumer/bin/python" dist/*.whl
          mkdir "$RUNNER_TEMP/snippet"
          cp tests/typing/consumer_snippet.py "$RUNNER_TEMP/snippet/"
          cd "$RUNNER_TEMP/snippet"
          uv run --project "$GITHUB_WORKSPACE" mypy --strict --python-executable "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py
          uv run --project "$GITHUB_WORKSPACE" pyright --pythonpath "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py
      - name: Control, both checkers refuse the snippet once a result's shape is not read-only
        run: |
          stub="$("$RUNNER_TEMP/consumer/bin/python" -c 'import materica, pathlib; print(pathlib.Path(materica.__file__).parent / "shapes.pyi")')"
          cp "$stub" "$RUNNER_TEMP/shapes.pyi"
          sed -i -E 's/: ReadOnly\[(.*)\]$/: \1/' "$stub"
          cd "$RUNNER_TEMP/snippet"
          if uv run --project "$GITHUB_WORKSPACE" mypy --strict --python-executable "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py; then
            echo "::error::mypy accepted a write into a result that is not read-only, so the check above cannot fail"
            exit 1
          fi
          if uv run --project "$GITHUB_WORKSPACE" pyright --pythonpath "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py; then
            echo "::error::pyright accepted a write into a result that is not read-only, so the check above cannot fail"
            exit 1
          fi
          cp "$RUNNER_TEMP/shapes.pyi" "$stub"
      - name: Control, the same check fails once py.typed is gone
        run: |
          rm "$("$RUNNER_TEMP/consumer/bin/python" -c 'import materica, pathlib; print(pathlib.Path(materica.__file__).parent / "py.typed")')"
          cd "$RUNNER_TEMP/snippet"
          if uv run --project "$GITHUB_WORKSPACE" mypy --strict --python-executable "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py; then
            echo "::error::the snippet type-checked without py.typed, so the check above cannot fail"
            exit 1
          fi

  generated:
    name: generated files
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # datamodel-code-generator, which gen_shapes.py runs, does not run on Python 3.15.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # Each regenerates its files in memory and fails where one on disk differs (CONTRIBUTING, "Changing the
      # schema"): the vocabulary from the specification's tables, the reader schema and the shapes from the
      # writer schemas.
      - run: uv run python scripts/gen_vocabulary.py --check
      - run: uv run python scripts/gen_reader_schema.py --check
      - run: uv run python scripts/gen_shapes.py --check

  tests:
    name: tests (Python ${{ matrix.python }})
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Measured on CI with the mutant searches and the audit controls in this job: at S2a-1's head 2.1 to 4.1
    # minutes; at S2a-2's, 6.1 to 8.7 minutes with 3.11 past 10, where its timeout cancelled it (run 38818013140,
    # 2026-10-15), then 8.7 to 13.9 minutes, 3.11 the slowest (run 38859424951, 2026-10-16). Without them, in the
    # first run with the controls job apart, 3.8 to 7.0 minutes, 3.14 and 3.15 the slowest (run 38954710616,
    # 2026-10-16). A hosted runner here is 1.6 to 4 times slower than a local core, and varies from run to run, so
    # the timeout is set well above the slowest measured job. With S2a-3 and its fix round, the whole suite, the
    # mutant searches and the audit controls among it, took 314 s on four local workers (Python 3.15,
    # 2026-10-16), unmeasured on CI.
    timeout-minutes: 40
    # The same minutes, from which the pytest step's interrupt is set (below).
    env:
      JOB_MINUTES: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # Every test but the mutant searches and the audit controls, which the next job runs; the property tests
      # at the `dev` profile: Python's json differs between versions, so the properties run on each; their
      # depth is the Hypothesis job's. A worker per vCPU, as in that job.
      # Each pytest command runs under `timeout --signal=INT`, three minutes before its job's limit (maintainer,
      # 2026-10-17; all but the fuzz job's, which write no report and start late among its steps). `timeout`
      # sends SIGINT to pytest's whole process group, its workers included, as Ctrl-C does, so that pytest
      # stops, writes the report of the tests that finished, and fails the step (`timeout` exits 124); the
      # durations steps then read that report. GitHub's own timeout would interrupt, then end, the step's shell
      # and not pytest, which writes its report only as its run ends, so a job cancelled that way has none (read
      # from the runner's code, and seen in a local run sent the same signals, 2026-10-16). uv runs `timeout`,
      # and so stays outside the group: under `timeout ... uv run pytest`, uv passed pytest a second SIGINT
      # during its shutdown, which then failed with a traceback and, in 4 of 7 local runs, no report; run this
      # way, 10 of 10 wrote it (uv 0.13.0 and 0.11.15, 2026-10-17). `JOB_MINUTES` repeats the job's
      # `timeout-minutes`, which no step can read, and tests/unit/test_ci_workflows.py holds the two equal for
      # every event and combination.
      - id: pytest
        run: >-
          uv run timeout --signal=INT "$((JOB_MINUTES - 3))m"
          pytest -n auto --dist worksteal --property-controls none --junitxml="$RUNNER_TEMP/durations.xml"
        env:
          MATERICA_HYPOTHESIS_PROFILE: dev
      # Where the time went, on the run's page, and the report kept for later runs to compare (no time fails
      # the job): scripts/report_test_durations.py. Whenever pytest ran, passed, failed, was interrupted before
      # the job's timeout, or was cancelled, and not where a failed checkout or setup skipped it. A run cancelled
      # from outside, or one that GitHub's timeout ends after all, has no report: the durations step then says
      # there is none, and the pytest step's log shows how far the run got.
      - name: Test durations
        if: always() && steps.pytest.outcome != 'skipped'
        env:
          TITLE: "Test durations: tests, Python ${{ matrix.python }}"
        run: uv run python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml" --title "$TITLE"
      - name: Keep the durations
        if: always() && steps.pytest.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-tests-${{ matrix.python }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error
          retention-days: 90

  controls:
    name: mutant searches and audit controls (Python ${{ matrix.python }})
    # The mutant searches and the audit controls show that each property and each feature audit can fail
    # (tests/README.md, "Every check can fail"). They run at the `ci` profile's examples whatever the profile,
    # so on each Python they cost about as much as all its other tests. They run on the supported range's
    # ends, the oldest Python and the newest, which bracket the versions between (maintainer, 2026-10-16), and
    # in a job of their own beside each end's test job, so that neither job is the longest: 3.11's was. The
    # Hypothesis job's shards run the mutant searches too. tests/unit/test_ci_workflows.py checks that the two
    # jobs together leave nothing out on 3.11 and 3.15, and only these tests on the Pythons between.
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Measured on CI in its first run: 3.4 minutes on 3.11 and 2.3 on 3.15 (run 38954710616, 2026-10-16). The test
    # job's timeout, until more runs are measured.
    timeout-minutes: 40
    env:
      JOB_MINUTES: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The mutant searches and the audit controls alone (`--property-controls` in tests/conftest.py), under the
      # same profile as the test job.
      - id: pytest
        run: >-
          uv run timeout --signal=INT "$((JOB_MINUTES - 3))m"
          pytest -n auto --dist worksteal --property-controls only --junitxml="$RUNNER_TEMP/durations.xml"
        env:
          MATERICA_HYPOTHESIS_PROFILE: dev
      - name: Test durations
        if: always() && steps.pytest.outcome != 'skipped'
        env:
          TITLE: "Test durations: mutant searches and audit controls, Python ${{ matrix.python }}"
        run: uv run python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml" --title "$TITLE"
      - name: Keep the durations
        if: always() && steps.pytest.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-controls-${{ matrix.python }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error
          retention-days: 90

  hypothesis:
    name: hypothesis (${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'deep' || 'ci' }}, ${{ matrix.shard }})
    needs: gate
    if: needs.gate.outputs.hypothesis == 'true'
    runs-on: ubuntu-24.04
    # On two workers locally, `deep` took 14.5 minutes for json and 10 for records (2026-10-14); step 8's
    # properties added about 17 minutes of CPU to the records shard's `deep` (2026-10-15, by S2a-2's review, on
    # three workers), unmeasured as a shard. At `ci`, records took 98 s on two workers and 58 s on four, and
    # step 8's mutants, a shard of their own, 51 s and 53 s; that shard's `deep` took 68 s on four, since its
    # searches do not grow with the profile (2026-10-15, S2a-2's fix round; a runner perhaps two to three times
    # slower a core, by estimate). The writer shard's `ci` took 11 minutes on two workers locally (2026-10-15),
    # and its `deep`, ten times the examples, about ten times that, unmeasured. Steps 9 and 10's properties,
    # which read records end to end, are a shard of their own, `conditions`, with their mutant searches, which
    # take seconds and do not grow with the profile. Measured locally at `ci` on four workers (Python 3.15,
    # 2026-10-16, S2a-3's fix round): `conditions` 112 s, records 62 s, and the writer shard 9.3 minutes, 158 s
    # of it one worker's, S2a-3's relation of the writer to step 9; `conditions` at `deep`, ten times the
    # examples, about 17 minutes by my arithmetic, unmeasured.
    # Measured on CI at `ci` (2026-10-15): the writer shard took 17 minutes at S2a-1's head (run 38726723407) and
    # passed 30 at S2a-2's (run 38818013140), where its timeout cancelled it, then took 11 at the same code (run
    # 38859424951), though locally its four workers took 8.1 and 7.1 minutes at those heads (Python 3.15): the
    # runner, not the code, made the difference. At S2a-2's head json took 0.9 to 1.4 minutes, records 2.3 to 2.5
    # and step 8's mutants 1.6 to 2.1. Each `ci` timeout is set well above the slowest measured run. `conditions`
    # has not run on CI: a hosted runner has taken 1.6 to 4 times as long as this machine (the matrix's comment),
    # which would be 3 to 7.5 minutes; its `ci` timeout is 30.
    # The agreement shard, on four workers locally (PR #24's fix round, 2026-10-17): at `ci`, 4.0 minutes, its
    # longest property 1.9, at load 4 to 7, and 8.0 minutes, its longest 4.7, at load 15 to 17; at `deep`, 112
    # minutes, its longest property 70, at load 18 to 30. A runner 1.6 to 4 times slower a core would take 13 to
    # 32 minutes at `ci`, and 3 to 7.5 hours at `deep`, so its `deep` timeout is GitHub's limit for a job on a
    # hosted runner.
    # Measured on CI with the five shards (2026-10-17): at `ci` (run 39002323592) agreement 5.9 minutes, writer
    # 5.2, records 2.5, json and step 8's mutants 1.6; at `deep`, the first run there (manual run 39002750375),
    # writer 63.6, agreement 47.0, records 31.4, json 14.1 and step 8's mutants 1.6. Records' `deep` timeout went
    # from 45 to 90 minutes on that run (the maintainer's default); agreement's stays 360 until a second run
    # agrees. tests/unit/test_ci_workflows.py holds each interrupt at twice the slowest run measured here, and
    # holds `conditions` once it has run on CI.
    timeout-minutes: >-
      ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && ((matrix.shard == 'writer' || matrix.shard == 'conditions') && 180 || matrix.shard == 'agreement' && 360
      || matrix.shard == 'records' && 90 || 45)
      || (matrix.shard == 'writer' && 75 || matrix.shard == 'conditions' && 30 || matrix.shard == 'agreement'
      && 45 || 20) }}
    strategy:
      fail-fast: false
      matrix:
        # Six shards side by side (`SHARDS` in tests/conftest.py): the JSON reader, RFC 8785 and the hash; the
        # envelope checks, versions and the read; the writer schema's value fields; the two JSON Schema
        # libraries' agreement, whose python-jsonschema validations make it the longest; step 8's mutant
        # searches, which were most of the records shard's time; and steps 9 and 10's properties with their
        # mutant searches.
        shard: [json, records, writer, agreement, step8_mutants, conditions]
    env:
      MATERICA_HYPOTHESIS_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'deep' || 'ci' }}
      # The job's `timeout-minutes`, as above, from which the pytest step's interrupt is set.
      JOB_MINUTES: >-
        ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        && ((matrix.shard == 'writer' || matrix.shard == 'conditions') && 180 || matrix.shard == 'agreement' && 360
        || matrix.shard == 'records' && 90 || 45)
        || (matrix.shard == 'writer' && 75 || matrix.shard == 'conditions' && 30 || matrix.shard == 'agreement'
        && 45 || 20) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Python, because it ran the shards fastest, locally: at the `ci` profile, two workers each, the
      # json shard took 39 to 48 s on 3.15 and 53 s on 3.11 (measured 2026-10-14); the records shard took 98 s
      # on 3.15 (2026-10-15). Every Python runs the properties at `dev`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The example database, so that an example that failed once is replayed first. Cache entries are
      # immutable, so each run saves under its own key and restores the latest; it saves even when the run
      # fails, since a failing example is what most needs keeping. Each shard keeps its own, so that one shard's
      # later save never hides an example the other saved.
      # Step 8's mutant searches keep no example database, so their shard restores and saves none; steps 9 and
      # 10's, in the conditions shard, set none either, which the shard's database leaves alone.
      - name: Restore the example database
        if: matrix.shard != 'step8_mutants'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-${{ matrix.shard }}-
      # A worker per vCPU: minutes are billed by wall time. Work stealing keeps the long properties from finishing
      # last on one worker.
      - name: Property tests and mutants, with the draw-rejection and feature audits (tests/property/conftest.py)
        id: pytest
        run: >-
          uv run timeout --signal=INT "$((JOB_MINUTES - 3))m"
          pytest tests/property --shard ${{ matrix.shard }} -n auto --dist worksteal
          --hypothesis-show-statistics --junitxml="$RUNNER_TEMP/durations.xml"
      - name: Test durations
        if: always() && steps.pytest.outcome != 'skipped'
        env:
          TITLE: "Test durations: hypothesis (${{ env.MATERICA_HYPOTHESIS_PROFILE }}, ${{ matrix.shard }})"
        run: uv run python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml" --title "$TITLE"
      - name: Keep the durations
        if: always() && steps.pytest.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-hypothesis-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error
          retention-days: 90
      - name: Save the example database
        if: always() && matrix.shard != 'step8_mutants'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}

  commit:
    name: commit ${{ matrix.sha }} on its own
    # Every commit of a pull request passes on its own before the merge, which CI checks commit by commit
    # (maintainer, 2026-10-16): each commit but the head, checked out as it is, gets the checks an agent runs
    # on a commit locally, on Python 3.15 alone, the fast checks, the wheel and its check, and the whole suite at
    # the `dev` profile, the mutant searches and audit controls included; the head keeps the jobs above, every
    # Python and the `ci` profile. The gate lists the commits, but those that change documentation alone; a pull request of one
    # commit lists none, and this job is skipped. At most six run at once: the organisation's 60 concurrent
    # jobs are shared with its other repositories.
    # A tree that passed these checks in an earlier run of the same pull request is not checked again. The
    # pass is kept in the cache, under the tree, this workflow's blob and the runner's image version, so that a
    # push that adds commits or rewrites their messages, or one after a run it cancelled, checks only the trees
    # not yet passed; a changed tree, a change to this workflow (the lock file, the tests, uv's version and
    # every action's pin among what the tree and the blob cover), or a new image under the same label (its git
    # and system libraries), is checked again. No test reads the date, the network or the repository's
    # history. The costs: `dev` draws fresh examples each run, and a tree not checked again forgoes another
    # draw; and a pass is only as good as every workflow the pull request's runs used, since a run whose
    # workflow a commit of the pull request edits can save an entry under any key, which a later run of the
    # same pull request trusts. Entries are read by the pull request that wrote them alone.
    needs: gate
    if: needs.gate.outputs.commits != '[]'
    runs-on: ubuntu-24.04
    # A Python 3.15 test job and controls job together: 3.8 and 2.6 minutes (run 39002323592, 2026-10-17). The
    # test job's timeout, until measured.
    timeout-minutes: 40
    env:
      JOB_MINUTES: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sha: ${{ fromJSON(needs.gate.outputs.commits) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      # ImageVersion is set by GitHub's hosted runners.
      - name: The key of a pass, from the commit's tree, this workflow's blob and the runner's image
        id: tree
        env:
          WORKFLOW_BLOB: ${{ needs.gate.outputs.workflow_blob }}
        run: |
          if [ -z "$WORKFLOW_BLOB" ]; then
            echo "::error::the gate gave no workflow_blob, so a pass under other checks could not be told apart"
            exit 1
          fi
          if [ -z "${ImageVersion:-}" ]; then
            echo "::error::the runner gives no ImageVersion, so a pass on another image could not be told apart"
            exit 1
          fi
          echo "key=commit-passed-$(git rev-parse 'HEAD^{tree}')-$WORKFLOW_BLOB-$ImageVersion" >> "$GITHUB_OUTPUT"
      # Every step after this one is skipped where the tree passed already.
      - name: Whether the tree passed these checks already
        id: passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.tree.outputs.key }}
          lookup-only: true
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv sync --locked
      - name: Cache pyright's Node package
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pyright-python
          key: pyright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv run ruff check
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv run ruff format --check
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv run mypy
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv run pyright
      - if: steps.passed.outputs.cache-hit != 'true'
        run: uv build
      - name: The wheel holds py.typed, the conformance data byte for byte, and its PEP 639 licence
        if: steps.passed.outputs.cache-hit != 'true'
        run: uv run python scripts/check_wheel.py dist/*.whl
      # On Python 3.11, as the generated-files job runs them: datamodel-code-generator, which gen_shapes.py
      # runs, does not run on 3.15. An environment of its own, beside the 3.15 one.
      - name: Every generator's check, on Python 3.11
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/python-3.11
        run: |
          uv sync --locked --python 3.11
          uv run --locked --python 3.11 python scripts/gen_vocabulary.py --check
          uv run --locked --python 3.11 python scripts/gen_reader_schema.py --check
          uv run --locked --python 3.11 python scripts/gen_shapes.py --check
      # The whole suite, as an agent runs it locally, under the interrupt the tests job's comment describes.
      - id: pytest
        if: steps.passed.outputs.cache-hit != 'true'
        run: >-
          uv run timeout --signal=INT "$((JOB_MINUTES - 3))m"
          pytest -n auto --dist worksteal
        env:
          MATERICA_HYPOTHESIS_PROFILE: dev
      - name: Keep the pass of this tree
        id: keep
        if: steps.passed.outputs.cache-hit != 'true'
        run: git rev-parse HEAD > "$RUNNER_TEMP/passed"
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.tree.outputs.key }}

  result:
    name: CI result
    # The one check the ruleset on main requires. A matrix job skipped by its `if` reports under another name, so
    # requiring the jobs by name would leave docs-only pull requests waiting. A job skipped by its `if` reports
    # success, so a gate wired wrongly (a renamed step id leaves its outputs empty) would skip every job and pass
    # a check that only looks for failures: this one fails unless every job the gate asked for succeeded.
    needs: [gate, static, generated, tests, controls, hypothesis, commit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job the gate asked for succeeded, and none failed or was cancelled
        env:
          GATE: ${{ needs.gate.result }}
          CODE: ${{ needs.gate.outputs.code }}
          HYPOTHESIS: ${{ needs.gate.outputs.hypothesis }}
          COMMITS: ${{ needs.gate.outputs.commits }}
          STATIC_JOB: ${{ needs.static.result }}
          GENERATED_JOB: ${{ needs.generated.result }}
          TESTS_JOB: ${{ needs.tests.result }}
          CONTROLS_JOB: ${{ needs.controls.result }}
          HYPOTHESIS_JOB: ${{ needs.hypothesis.result }}
          COMMIT_JOB: ${{ needs.commit.result }}
        run: |
          status=0
          fail() { echo "::error::$1"; status=1; }
          asked() { [ "$2" = success ] || fail "the gate asked for $1, which ended in '$2'"; }
          echo "gate $GATE (code $CODE, hypothesis $HYPOTHESIS, commits $COMMITS); static $STATIC_JOB, generated $GENERATED_JOB, tests $TESTS_JOB, controls $CONTROLS_JOB, hypothesis $HYPOTHESIS_JOB, commit $COMMIT_JOB"
          [ "$GATE" = success ] || fail "the gate ended in '$GATE'"
          case "$CODE $HYPOTHESIS" in
            "true true" | "true false" | "false true" | "false false") ;;
            *) fail "the gate's outputs are code '$CODE' and hypothesis '$HYPOTHESIS', not each true or false" ;;
          esac
          if [ "$CODE" = true ]; then
            asked static "$STATIC_JOB"
            asked generated "$GENERATED_JOB"
            asked tests "$TESTS_JOB"
            asked controls "$CONTROLS_JOB"
          fi
          if [ "$HYPOTHESIS" = true ]; then asked hypothesis "$HYPOTHESIS_JOB"; fi
          # The commits to check on their own: none, or a list, which asks for the per-commit job.
          case "$COMMITS" in
            "[]") ;;
            \[\"*\"\]) asked "the commits before the head" "$COMMIT_JOB" ;;
            *) fail "the gate's commits are '$COMMITS', not a list" ;;
          esac
          for result in "$STATIC_JOB" "$GENERATED_JOB" "$TESTS_JOB" "$CONTROLS_JOB" "$HYPOTHESIS_JOB" "$COMMIT_JOB"; do
            case "$result" in failure | cancelled) fail "a job ended in '$result'" ;; esac
          done
          exit "$status"

  fuzz:
    name: fuzz (Atheris)
    # After the Hypothesis job, so that it starts from the example database that job just saved, and saves the
    # two jobs' finds together; it runs whether that job passed, failed or was skipped.
    needs: hypothesis
    # Weekly and on a manual run only: every second of fuzzing is a second billed.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # Four targets at the default 300 s, the control (at most 3 minutes for each of the first three targets and
    # 15 for the fourth) and the replay, which leaves out the mutant tables: about 50 minutes, by estimate. A
    # manual run longer than about 450 s a target needs this raised.
    timeout-minutes: 65
    env:
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || 300 }}
      # The fuzzing and its replay run under one profile: the properties' sizes come from it, and a failure
      # replays only under the profile it was found with.
      MATERICA_HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Atheris 3.1.0 publishes wheels for Python 3.12 to 3.14 only.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group fuzz

      # Before the example database is restored, and with it removed after: the first two targets must find a
      # fault seeded in `parse`, the third one seeded in the read, and the fourth one seeded in step 10
      # (tests/fuzz/seeded_fault.py); the replay must find what the property targets saved again and shrink it.
      - name: Control, the faults seeded in parse, the read and step 10 are found, replayed and shrunk
        env:
          MATERICA_FUZZ_SEEDED_FAULT: "1"
        run: |
          control="$RUNNER_TEMP/control"
          mkdir -p "$control/findings"
          uv run python -m tests.fuzz.jsonio_bytes --seed "$control/corpus"
          uv run python -m tests.fuzz.jsonio_bytes "$control/corpus" -dict=tests/fuzz/json.dict -max_len=4096 \
            -max_total_time=180 -artifact_prefix="$control/findings/" > "$control/bytes.log" 2>&1 || true
          uv run python -m tests.fuzz.properties -max_total_time=180 -artifact_prefix="$control/findings/" \
            > "$control/properties.log" 2>&1 || true
          uv run python -m tests.fuzz.record_properties -max_total_time=180 -artifact_prefix="$control/findings/" \
            > "$control/record_properties.log" 2>&1 || true
          uv run python -m tests.fuzz.read_field_bytes --seed "$control/fields"
          uv run python -m tests.fuzz.read_field_bytes --dict "$control/value_field.dict"
          # Its fault is behind two changes to one seed: one run found it after 84 to 601 s in ten local runs, six
          # at a time (2026-10-16). Two runs side by side, each of up to 900 s, on the runner's cores: the control
          # passes where either finds it.
          for worker in 1 2; do
            cp -r "$control/fields" "$control/fields-$worker"
            uv run python -m tests.fuzz.read_field_bytes "$control/fields-$worker" \
              -dict="$control/value_field.dict" -max_total_time=900 -artifact_prefix="$control/findings/" \
              > "$control/read_field_bytes-$worker.log" 2>&1 &
          done
          wait || true
          cat "$control/read_field_bytes-1.log" "$control/read_field_bytes-2.log" > "$control/read_field_bytes.log"
          uv run python -m pytest -p tests.fuzz.seeded_fault -q --hypothesis-show-statistics \
            tests/property/test_jsonio_properties.py tests/property/test_canonical_properties.py \
            tests/property/test_hashing_properties.py tests/property/test_read_properties.py \
            > "$control/replay.log" 2>&1 || true
          # Each step and the fault it must find: the replay runs the properties of both.
          for check in "bytes:in parse" "properties:in parse" "record_properties:in the read" \
            "read_field_bytes:in step 10" "replay:in parse" "replay:in the read"; do
            log="${check%%:*}"
            fault="${check#*:}"
            if ! grep -q "IndexError: the seeded fault $fault" "$control/$log.log"; then
              tail -40 "$control/$log.log"
              echo "::error::the $log step did not find the fault seeded $fault, so it could not find a real one"
              exit 1
            fi
          done
          # Only a stored example can fail in the reuse phase: the replay found what the fuzzing saved. Each
          # reads its lines through `<(...)`: a command that stops reading early (`grep -q`, `head`) would
          # end the one writing to it, which fails a pipe under pipefail.
          if ! grep -qE " [1-9][0-9]* failing" <(grep -A3 "during reuse phase" "$control/replay.log"); then
            echo "::error::the replay did not find the failure the fuzzing saved"
            exit 1
          fi
          head -40 <(grep -B2 -A3 -E "document=|data=|world=|shuffled=" "$control/replay.log")
          rm -rf .hypothesis

      # The databases the Hypothesis job's shards saved in this run, the latest saved where it did not run,
      # restored one over the other: their union.
      - name: Restore the example database of the json shard
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-json-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-json-
      - name: Restore the example database of the records shard
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-records-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-records-
      - name: Restore the example database of the conditions shard
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-conditions-${{ github.run_id }}
          restore-keys: hypothesis-${{ runner.os }}-conditions-
      # Target 1's corpus from earlier runs, so that its coverage builds up; it is seeded afresh as well.
      - name: Restore the raw-bytes corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-kept
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-
      - name: Fuzz raw bytes into parse (tests/fuzz/jsonio_bytes.py)
        run: |
          mkdir -p "$RUNNER_TEMP/findings" "$RUNNER_TEMP/corpus-kept"
          uv run python -m tests.fuzz.jsonio_bytes --seed "$RUNNER_TEMP/corpus"
          find "$RUNNER_TEMP/corpus-kept" -type f -exec cp -t "$RUNNER_TEMP/corpus" {} +
          uv run python -m tests.fuzz.jsonio_bytes "$RUNNER_TEMP/corpus" -dict=tests/fuzz/json.dict -max_len=4096 \
            -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      # libFuzzer keeps, in a fresh directory, only the inputs that add coverage, so the cache stays small. A
      # merge that went wrong keeps nothing, and must not replace the corpus.
      - name: Minimise the raw-bytes corpus
        id: merge
        if: success() || failure()
        run: |
          mkdir "$RUNNER_TEMP/corpus-next"
          uv run python -m tests.fuzz.jsonio_bytes -merge=1 "$RUNNER_TEMP/corpus-next" "$RUNNER_TEMP/corpus"
          if [ -z "$(ls -A "$RUNNER_TEMP/corpus-next")" ]; then
            echo "::error::the merge kept no input"
            exit 1
          fi
          echo "kept $(ls "$RUNNER_TEMP/corpus-next" | wc -l) of $(ls "$RUNNER_TEMP/corpus" | wc -l) inputs"
          rm -rf "$RUNNER_TEMP/corpus-kept"
          mv "$RUNNER_TEMP/corpus-next" "$RUNNER_TEMP/corpus-kept"
      # Saved from the path it is restored to: a cache entry is versioned by its path.
      - name: Save the raw-bytes corpus
        if: steps.merge.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-kept
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
      - name: Fuzz the properties (tests/fuzz/properties.py)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          uv run python -m tests.fuzz.properties -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      - name: Fuzz the record properties (tests/fuzz/record_properties.py)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          uv run python -m tests.fuzz.record_properties -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      - name: Fuzz raw bytes into step 8 (tests/fuzz/read_field_bytes.py)
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/findings"
          uv run python -m tests.fuzz.read_field_bytes --seed "$RUNNER_TEMP/fields"
          uv run python -m tests.fuzz.read_field_bytes --dict "$RUNNER_TEMP/value_field.dict"
          uv run python -m tests.fuzz.read_field_bytes "$RUNNER_TEMP/fields" -dict="$RUNNER_TEMP/value_field.dict" \
            -max_total_time="$FUZZ_SECONDS" -artifact_prefix="$RUNNER_TEMP/findings/"
      # What the property target found is in the example database: replayed first here, and shrunk. The writer
      # schema's properties and the two JSON Schema libraries' agreement are no fuzz target, and their shards
      # keep their own databases; the mutant tables keep none, so they have nothing to replay.
      - name: Replay and shrink what was found
        if: success() || failure()
        run: >-
          uv run pytest tests/property -n auto --dist worksteal
          --ignore=tests/property/test_writer_properties.py --ignore=tests/property/test_writer_mutants.py
          --ignore=tests/property/test_validators_agree.py
          --ignore=tests/property/test_mutants.py --ignore=tests/property/test_record_mutants.py
          --ignore=tests/property/test_value_field_mutants.py --ignore=tests/property/test_condition_mutants.py
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/findings/
          if-no-files-found: ignore
      # Both jobs' finds, under each shard's prefix: the next run of either shard, or of this job, restores them.
      - name: Save the example database for the json shard
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-json-${{ github.run_id }}-fuzz
      - name: Save the example database for the records shard
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-records-${{ github.run_id }}-fuzz
      - name: Save the example database for the conditions shard
        if: always()
